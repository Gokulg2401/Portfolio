spring.application.name=portfolio

# Local, git-ignored overrides (put Gmail credentials here — see secrets.properties.example)
spring.config.import=optional:file:./secrets.properties

# --- Server ---
# Hosting platforms (Render, Railway, ...) inject PORT; locally we use 8080.
server.port=${PORT:8080}
# Trust X-Forwarded-* from the platform's proxy so rate limiting sees the real client IP.
server.forward-headers-strategy=framework
server.compression.enabled=true

# --- Mail option 1: Resend HTTPS API (use this on hosts that block SMTP, e.g. Render free) ---
portfolio.mail.resend.api-key=${RESEND_API_KEY:}
portfolio.mail.resend.from=${RESEND_FROM:Portfolio Contact <onboarding@resend.dev>}

# --- Mail option 2: Gmail SMTP (password must be a Google App Password) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Portfolio ---
portfolio.contact.recipient=${CONTACT_RECIPIENT:gokul240102@gmail.com}
portfolio.contact.max-requests-per-window=3
portfolio.contact.window-minutes=10
